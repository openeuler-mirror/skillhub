map $scheme $hsts_header {
    https "max-age=31536000";
    default "";
}

limit_conn_zone $binary_remote_addr zone=per_ip_connections:10m;
limit_req_zone $binary_remote_addr zone=per_ip_api_requests:10m rate=30r/s;

server {
    listen 8080;
    server_name localhost;
    charset utf-8;
    server_tokens off;

    client_max_body_size 5m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    limit_conn per_ip_connections 20;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Strict-Transport-Security $hsts_header always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    root /usr/share/nginx/html;
    index index.html;

    listen 8443 ssl;
    ssl_session_tickets off;
    ssl_session_timeout 10s;
    ssl_session_cache shared:SSL:10m;
    ssl_certificate "cert/server.crt";
    ssl_certificate_key "cert/server.key";
    ssl_password_file "cert/abc.txt";
    ssl_dhparam "cert/dhparam.pem";
    ssl_ecdh_curve auto;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers "ECDHE-RSA-AES256-GCM-SHA384";
    ssl_prefer_server_ciphers on;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=60s;
    resolver_timeout 5s;

    if ($request_method = TRACE) {
        return 405;
    }

    location /api/ {
        limit_req zone=per_ip_api_requests burst=60 nodelay;

        proxy_pass http://skill-hub-backend.openeuler-skillhub:8081/api/;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api-dsapi/ {
        # 采集端跨域直连，浏览器会先发 CORS 预检（application/json 触发），
        # 这里直接应答 OPTIONS，避免被 server 级 405 拦截。
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Methods "POST, GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type" always;
            add_header Access-Control-Max-Age       86400 always;
            return 204;
        }

        proxy_pass https://dsapi.osinfra.cn/;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
    }

    # 安装引导文档与一键安装脚本（供 AI Agent 抓取执行）
    location /install/ {
        types {
            text/plain md;
            text/x-shellscript sh;
        }
        charset utf-8;
        charset_types text/plain text/x-shellscript;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "0" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header Content-Security-Policy "default-src 'none'" always;
    }

    location ~ /\.(?:git|svn|hg)(?:/|$) {
        deny all;
    }

    location ~ ^/\.env(?:\.|$) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
