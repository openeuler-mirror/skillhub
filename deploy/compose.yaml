name: docker

services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES__USER:?POSTGRES__USER is required}
      POSTGRES_PASSWORD: ${POSTGRES__PASSWORD:?POSTGRES__PASSWORD is required}
      POSTGRES_DB: ${POSTGRES__DB:?POSTGRES__DB is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - skillhub-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  embedding:
    build:
      context: ..
      dockerfile: deploy/embedding/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
    ports:
      - "8082:8082"
    environment:
      WITTYHUB_CONFIG: /app/config.yaml
      PYTHONDONTWRITEBYTECODE: "1"
      HF_HOME: /models-cache
      SENTENCE_TRANSFORMERS_HOME: /models-cache
      # 离线环境：权重已缓存在 huggingface-cache 卷，启用 HF 离线模式跳过
      # Hub 元数据请求（否则启动时反复重试导致 /health 迟迟不就绪）
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ../config.yaml:/app/config.yaml:ro
      - huggingface-cache:/models-cache
    networks:
      - skillhub-network
    healthcheck:
      # 用标准库 urllib：embedding 镜像不含 httpx，healthcheck 需零第三方依赖
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/api/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,mode=1777
    ports:
      - "8081:8081"
    environment:
      WITTYHUB_CONFIG: /app/config.yaml
      PYTHONDONTWRITEBYTECODE: "1"
      POSTGRES__HOST: db
      POSTGRES__PORT: 5432
      POSTGRES__USER: ${POSTGRES__USER:?POSTGRES__USER is required}
      POSTGRES__PASSWORD: ${POSTGRES__PASSWORD:?POSTGRES__PASSWORD is required}
      POSTGRES__DB: ${POSTGRES__DB:?POSTGRES__DB is required}
      AI__EMBEDDING_HOST: http://embedding:8082
      SECURITY__SKILLSPECTOR_JENKINS_URL: ${SECURITY__SKILLSPECTOR_JENKINS_URL:-http://skillspector:8083}
      SECURITY__SKILLSPECTOR_JENKINS_USER: ${SECURITY__SKILLSPECTOR_JENKINS_USER:-admin}
      SECURITY__SKILLSPECTOR_JENKINS_TOKEN: ${SECURITY__SKILLSPECTOR_JENKINS_TOKEN:-}
      # 后台定时 LLM 复核：每天 01:00-08:00（下方 TZ 为北京时间）复核数据库中
      # 未复核过的 SkillSpector 风险项，剔除误报并回写审计结果。
      # model/base_url/api_key 留空时复用 model.providers 当前 provider
      # （默认 siliconflow / Qwen3.5-4B）；需要单独指定时再覆盖。
      AUDIT_LLM_REVIEW__ENABLED: ${AUDIT_LLM_REVIEW__ENABLED:-true}
      AUDIT_LLM_REVIEW__API_KEY: ${AUDIT_LLM_REVIEW__API_KEY:-}
      AUDIT_LLM_REVIEW__START_TIME: "${AUDIT_LLM_REVIEW__START_TIME:-01:00}"
      AUDIT_LLM_REVIEW__END_TIME: "${AUDIT_LLM_REVIEW__END_TIME:-08:00}"
      AUDIT_LLM_REVIEW__CONCURRENCY: ${AUDIT_LLM_REVIEW__CONCURRENCY:-3}
      AUDIT_LLM_REVIEW__MIN_CONFIDENCE: ${AUDIT_LLM_REVIEW__MIN_CONFIDENCE:-0.6}
      AUDIT_LLM_REVIEW__MIN_FALSE_POSITIVE_CONFIDENCE: ${AUDIT_LLM_REVIEW__MIN_FALSE_POSITIVE_CONFIDENCE:-0.85}
      AUDIT_LLM_REVIEW__MIN_FALSE_POSITIVE_CONFIDENCE_HIGH: ${AUDIT_LLM_REVIEW__MIN_FALSE_POSITIVE_CONFIDENCE_HIGH:-0.9}
      AUDIT_LLM_REVIEW__MAX_OUTPUT_TOKENS: ${AUDIT_LLM_REVIEW__MAX_OUTPUT_TOKENS:-2048}
      # 上下文：本地 repo 缓存优先，缺失时按 commit 拉取远端 raw，失败回退 snippet
      AUDIT_LLM_REVIEW__CONTEXT_MODE: ${AUDIT_LLM_REVIEW__CONTEXT_MODE:-window}
      AUDIT_LLM_REVIEW__WINDOW_LINES: ${AUDIT_LLM_REVIEW__WINDOW_LINES:-40}
      AUDIT_LLM_REVIEW__REPO_CACHE_ROOT: ${AUDIT_LLM_REVIEW__REPO_CACHE_ROOT:-/opt/wittyhub/skill-repositories}
      AUDIT_LLM_REVIEW__REMOTE_FETCH_ENABLED: ${AUDIT_LLM_REVIEW__REMOTE_FETCH_ENABLED:-true}
      AUDIT_LLM_REVIEW__GITHUB_TOKEN: ${AUDIT_LLM_REVIEW__GITHUB_TOKEN:-}
      AUDIT_LLM_REVIEW__GITCODE_TOKEN: ${AUDIT_LLM_REVIEW__GITCODE_TOKEN:-}
      AUDIT_LLM_REVIEW__GITLAB_TOKEN: ${AUDIT_LLM_REVIEW__GITLAB_TOKEN:-}
      AUDIT_LLM_REVIEW__GITEE_TOKEN: ${AUDIT_LLM_REVIEW__GITEE_TOKEN:-}
      TZ: Asia/Shanghai
    volumes:
      - ../config.yaml:/app/config.yaml:ro
      - /opt/wittyhub:/opt/wittyhub
    networks:
      - skillhub-network
    depends_on:
      db:
        condition: service_healthy
      embedding:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8081/api/v1/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=64m,mode=0770,uid=101,gid=101
      - /var/run/nginx:rw,noexec,nosuid,nodev,size=16m,mode=0770,uid=101,gid=101
    ports:
      - "8080:8080"
      - "443:8443"
    networks:
      - skillhub-network
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  skillspector:
    profiles: ["skillspector"]
    build:
      context: ..
      dockerfile: deploy/skillspector/Dockerfile
    ports:
      - "8083:8083"
      - "50000:50000"
    environment:
      # Jenkins 部署参数与大模型复核参数（admin 密码、模型、API Key、限流、
      # 并发与超时等）统一由 config.yaml（WITTYHUB_CONFIG）管理：容器入口启动时
      # 读取 security.skillspector_*，注入为 JENKINS_* / SKILLSPECTOR_* / OPENAI_*。
      # 生产部署不依赖本文件；确需临时覆盖时可用 docker -e（仅当 config.yaml
      # 对应值为空时生效，例如 OPENAI_API_KEY）。
      WITTYHUB_CONFIG: /app/config.yaml
      TZ: Asia/Shanghai
    volumes:
      - ../config.yaml:/app/config.yaml:ro
      - jenkins-data:/var/jenkins_home
      - /opt/wittyhub:/opt/wittyhub:ro
    networks:
      - skillhub-network
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8083/login >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

volumes:
  postgres-data:
  huggingface-cache:
  jenkins-data:

networks:
  skillhub-network:
    driver: bridge
