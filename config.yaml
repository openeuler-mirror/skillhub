# 1. 配置优先级（从低到高）：代码默认值 < 本文件 < SECTION__FIELD 环境变量。
# 2. Docker 部署时，deploy/.env 由 Compose 读取；
# 只有 compose.yaml 显式映射的变量才会进入容器并覆盖本文件，
# 例如 POSTGRES__PASSWORD -> postgres.password。
# 3. 本地直接运行 Python 时不会自动读取 deploy/.env，此时默认使用本文件。

storage:
  type: "local"
  local_path: "/opt/wittyhub"

model:
  # 当前生效的 provider，切换模型只改这一行（也可用 MODEL__PROVIDER 环境变量覆盖）。
  # 两家都是 OpenAI 兼容接口，调用侧（分类/翻译）无需改代码。
  provider: siliconflow
  providers:
    deepseek:
      name: deepseek-flash
      base_url: https://api.deepseek.com
      api_key: ""
      timeout: 60
    siliconflow:
      # 硅基流动 免费模型，api_key 在 cloud.siliconflow.cn 控制台获取
      name: Qwen/Qwen3.5-4B
      base_url: https://api.siliconflow.cn/v1
      api_key: ""
      timeout: 60

crawler:
  github_token: ""
  atomgit_token: ""

security:
  # Skillspector (Jenkins-based scanner) — sensitive fields via env vars
  enable_audit: true
  skillspector_jenkins_url: "http://localhost:8083"
  skillspector_jenkins_user: "admin"
  # 该 Token 同时用作 Jenkins admin 密码：skillspector 容器启动时直接读取
  #（WITTYHUB_CONFIG 指向本文件），注入为 JENKINS_ADMIN_PASS。
  skillspector_jenkins_token: ""
  # 同步扫描等待 Jenkins 构建结束的超时（秒）；超过后该次审计返回 unknown
  skillspector_timeout: 600
  # Jenkins 容器部署参数（skillspector 容器启动时读取，注入为
  # JENKINS_OPTS / JENKINS_ADMIN_PASS / JENKINS_NUM_EXECUTORS /
  # JENKINS_QUIET_PERIOD / WITTYHUB_REPOSITORY_ROOT 环境变量）
  skillspector_jenkins_http_port: 8083
  skillspector_jenkins_num_executors: 10
  skillspector_jenkins_quiet_period: 1
  skillspector_repository_root: "/opt/wittyhub/skill-repositories"
  # SkillSpector 大模型复核参数：生产部署不读 deploy/compose.yaml 的环境变量，
  # 统一由本文件提供给 skillspector 容器（容器入口启动时读取，注入为
  # SKILLSPECTOR_* / OPENAI_* 环境变量）。
  # model/base_url/api_key 留空时复用 model.providers 当前 provider
  #（默认 siliconflow / Qwen3.5-4B），需要为扫描单独指定时再覆盖。
  skillspector_llm_nodes: "meta_analyzer"   # 仅 meta 复核节点调用大模型，语义发现节点不调用
  skillspector_model: ""
  skillspector_base_url: ""
  skillspector_api_key: ""
  # 成本/上下文控制：跳过二进制、按规则×文件类别裁剪、只送命中窗口行
  skillspector_text_only: true
  skillspector_rule_scope: true
  skillspector_window_lines: 20
  skillspector_window_header_lines: 40
  # 客户端限流，与 Qwen3.5-4B 免费档配额对齐（0 = 不限流）
  skillspector_rpm: 1000
  skillspector_tpm: 80000
  # 输出预算与思考模式：4096 足够单批判定，也能为 TPM 预留留出并发空间
  skillspector_max_output_tokens: 4096
  skillspector_disable_thinking: true
  skillspector_log_level: "INFO"
  # 并发与超时：免费档实测可用并发约 4；BATCH_TIMEOUT 需覆盖 LLM 重试总时长；
  # BUDGET_SECONDS 必须小于 security.skillspector_timeout 与 nginx 读超时
  skillspector_max_concurrency: 4
  skillspector_batch_timeout: 300
  skillspector_llm_timeout: 90
  skillspector_llm_budget_seconds: 540

postgres:
  host: "localhost"
  port: 5432
  user: "wittyhub"
  password: ""
  db: "wittyhub"
  sslmode: "disable"

ai:
  embedding_model: "BAAI/bge-base-zh-v1.5"
  embedding_host: "http://localhost:8082"
  embedding_dimension: 768
  enable_semantic_search: true

app:
  admin_api_token: "" # APP__ADMIN_API_TOKEN='高强度随机Token'：openssl rand -hex 32
  cors_origins:
    - "http://localhost:8080"
    - "http://127.0.0.1:8080"

# 后台定时 discover：按 openEuler-skills catalog 全量扫描仓库
# 环境变量覆盖示例：DISCOVER_SCHEDULER__ENABLED=true、DISCOVER_SCHEDULER__START_TIME=16:00、
# DISCOVER_SCHEDULER__TIMEZONE=Asia/Shanghai
discover_scheduler:
  enabled: true
  start_time: "00:00"        # 触发时刻（HH:MM，按 timezone 解释）
  timezone: "Asia/Shanghai"  # 触发时刻时区（与容器 TZ 无关）
  result_dir: ""             # 每轮结果 JSON 保存目录；留空则用 storage.local_path/logs

# 后台定时 LLM 复核：每天 01:00-08:00（按 timezone 解释，默认北京时间，
# 与容器 TZ 解耦）
# 在窗口内分批复核未复核过的 SkillSpector 风险项，剔除误报后回写
# security_audits 与 skills/skill_versions。model/base_url/api_key 留空时
# 复用 model.providers 当前 provider（默认 siliconflow / Qwen3.5-4B）；
# 需要单独指定复核模型时再用 AUDIT_LLM_REVIEW__MODEL / __BASE_URL / __API_KEY
# 覆盖。全部为空时任务自动跳过（仅告警）。
# 环境变量覆盖示例：AUDIT_LLM_REVIEW__START_TIME=01:00、
# AUDIT_LLM_REVIEW__TIMEZONE=Asia/Shanghai、
# AUDIT_LLM_REVIEW__CONCURRENCY=3、AUDIT_LLM_REVIEW__MAX_FINDINGS_PER_AUDIT=200
audit_llm_review:
  enabled: true
  start_time: "01:00"
  end_time: "08:00"
  timezone: "Asia/Shanghai"             # 窗口时区（与容器 TZ 无关）
  model: ""                             # 留空复用 model.providers 的模型名
  base_url: ""                          # 留空复用 model.providers 的 base_url
  api_key: ""                           # 留空复用 model.providers 的 key
  timeout: 90
  concurrency: 3
  max_findings_per_call: 10
  max_findings_per_audit: 200           # 单轮 pass 上限；一轮扫完后立即开始下一轮，窗口内可连续推进；0=不限
  # 复核上下文：本地 repo 缓存 -> 远端 raw -> 现有 snippet。
  # window 模式对小文件送全文，大文件按命中位置取窗口行。
  context_mode: "window"                # snippet | window | full
  window_lines: 40
  window_header_lines: 40
  window_max_ranges: 24
  window_gap: 3
  full_file_max_bytes: 65536
  max_file_bytes: 524288
  max_context_chars: 60000
  repo_cache_root: "/opt/wittyhub/skill-repositories"
  git_timeout: 20
  remote_fetch_enabled: true
  remote_fetch_timeout: 15
  remote_fetch_max_bytes: 524288
  remote_fetch_max_files_per_audit: 40
  github_token: ""
  gitcode_token: ""
  gitlab_token: ""
  gitee_token: ""
  context_cache_max_bytes: 67108864
  max_output_tokens: 2048               # 判定仅返回 index/is_vulnerability/confidence/reason
  min_confidence: 0.6                   # 确认为真但置信度低于该值的命中按上游口径丢弃；0=关闭
  min_false_positive_confidence: 0.85   # 误报删除门槛：false 判定低于该值不删除；0=关闭
  min_false_positive_confidence_high: 0.9  # HIGH/CRITICAL 命中使用更严格的删除门槛
  max_attempts: 3                       # 失败重试轮次（跨天累计）
  rpm: 1000
  tpm: 80000
  # 可观测性：单次 LLM 调用 / 限流等待超过阈值时打 warning（0=关闭）
  slow_llm_seconds: 30
  rate_limit_slow_wait_seconds: 30
  # 每轮结果 JSON 保存目录（空则 storage.local_path/logs）；
  # 按天数和份数双重保留，超出后自动清理（0=不限制该维度）
  result_dir: ""
  result_keep_days: 30
  result_max_files: 200

# 后台定时 license 清理：与 openeuler-jenkins 门禁使用同一判定引擎与准入清单。
# 每天 start_time（按 timezone 解释）扫描全库 skill，删除判定为 failed 的 skill；
# atomgit.com/openeuler/* 默认保护（只报告不删除）。
# 环境变量覆盖示例：LICENSE_AUDIT__ENABLED=true、LICENSE_AUDIT__START_TIME=00:30
license_audit:
  enabled: true
  start_time: "00:30"
  timezone: "Asia/Shanghai"
  dry_run: false                  # true 只出报告不删除（排障用）
  batch_size: 200                 # 每批提交的删除条数
  result_dir: ""                  # 空则 storage.local_path/logs
  result_keep_days: 30
  result_max_files: 200

  gate:
    engine_commit: "52f25bd"      # vendored 门禁引擎对应提交（19467f1 + PR #711）
    access_list_url: "https://api.atomgit.com/api/v5/repos/openeuler/compliance/raw/doc/rule/Licenses_Access_List.yaml?ref=master"
    access_list_cache: ""         # 空则 storage.local_path/license/Licenses_Access_List.yaml
    access_list_ttl_hours: 24
    access_list_timeout: 30
    extra_allow:                  # 清单未收录/未获 oE 认可但允许分发的许可；不覆盖 black
      - CANN-2.0
      - SUL-1.0
      - FSL-1.1-Apache-2.0
      - Convex-CPL
      - CC-BY-3.0-US
    prefer_file: true             # 声明不可用/受限时以 LICENSE 文件为准

  actions:                        # 与门禁 ac.yaml 一致
    allowed: success
    conflict: warning
    restricted: failed
    missing: failed
    unknown: failed
    black: failed

  repo:
    remote_cache_root: ""         # 空则 storage.local_path/license-repos
    remote_cache_ttl_days: 7
    remote_fetch: true            # 本地 clone 缺失时远程浅克隆
    remote_concurrency: 4
    git_timeout: 60

  safety:
    max_deletions_per_run: 500
    backup_before_delete: true
    backup_dir: ""                # 空则 storage.local_path/license-backups
    backup_keep_days: 30
    backup_keep_files: 30
    protected_repos:
      - "atomgit.com/openeuler/*"
    abort_on_access_list_failure: true

logging:
  level: "INFO"
  format: "json"
  # api.log 轮转：单文件 100MB，保留 5 份（max_bytes=0 关闭轮转）
  max_bytes: 104857600
  backup_count: 5
  timezone: "Asia/Shanghai"
